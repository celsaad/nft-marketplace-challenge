<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140d0a" />
    <meta name="description" content="Kurio — marketplace de NFTs: descubra, colecione e compre arte digital de criadores emergentes e consagrados." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kurio — Marketplace de NFTs</title>
  </head>
  <body>
    <div id="root">
      <!-- Static app shell: paints with the CSS alone, before the JS runs; React replaces it on its
           first render. Only what is the same for every visitor and locale (the header box and the
           logo), so nothing here looks usable before it is. Matches src/app/shell/header.tsx. -->
      <div aria-hidden="true">
        <header class="border-b border-border/60">
          <div class="mx-auto flex h-16 max-w-[1248px] items-center justify-between gap-4 px-4 md:px-6">
            <span class="text-sm font-bold tracking-[0.2em]">KURIO</span>
          </div>
        </header>
        <div class="min-h-dvh"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
